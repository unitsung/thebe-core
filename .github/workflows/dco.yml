name: dco

# Every commit in a pull request must carry a Signed-off-by trailer (CONTRIBUTING.md,
# Developer Certificate of Origin). Direct pushes by maintainers are not checked.

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash scripts/check-dco.sh "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
