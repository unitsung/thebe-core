name: Codex review gate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: codex-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Codex review publisher
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request != null
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require a current-head Codex review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/codex-pr.json
          gh api --paginate --slurp \
            "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            > /tmp/codex-comments.json

          set +e
          node <<'NODE' > /tmp/codex-review.log 2>&1
          const fs = require("node:fs");

          const head = JSON.parse(fs.readFileSync("/tmp/codex-pr.json", "utf8")).head.sha;
          const commentPages = JSON.parse(
            fs.readFileSync("/tmp/codex-comments.json", "utf8"),
          );
          const comments = commentPages.flat();

          const marker = "<!-- codex-review-state:v1 ";
          const summaries = comments
            .filter(
              (comment) =>
                comment.user?.login === "chatgpt-codex-connector[bot]" &&
                comment.body?.includes(marker),
            )
            .flatMap((comment) => {
              const start = comment.body.indexOf(marker) + marker.length;
              const end = comment.body.indexOf(" -->", start);
              if (end < 0) return [];
              try {
                return [
                  {
                    createdAt: comment.created_at,
                    updatedAt: comment.updated_at,
                    state: JSON.parse(comment.body.slice(start, end)),
                  },
                ];
              } catch {
                return [];
              }
            })
            .sort((left, right) =>
              (left.updatedAt ?? left.createdAt ?? "").localeCompare(
                right.updatedAt ?? right.createdAt ?? "",
              ),
            );
          const codeReview = summaries.at(-1)?.state?.code_review;

          if (!codeReview) {
            console.error(`Codex review has not reported for current head ${head}.`);
            process.exit(1);
          }
          if (codeReview.commit_sha !== head) {
            console.error(
              `Codex reviewed ${codeReview.commit_sha}, but the current head is ${head}.`,
            );
            process.exit(1);
          }
          if (codeReview.status !== "completed") {
            console.error(`Codex review is ${codeReview.status} for ${head}.`);
            process.exit(1);
          }

          console.log(`Codex review passed for ${head}.`);
          NODE
          result=$?
          set -e
          cat /tmp/codex-review.log

          head="$(jq -r .head.sha /tmp/codex-pr.json)"
          if [ "$result" = "0" ]; then
            state=success
            description="Current-head Codex review passed"
          else
            state=failure
            description="Current-head Codex review has not passed"
          fi
          gh api --method POST \
            "repos/${REPOSITORY}/statuses/${head}" \
            -f state="$state" \
            -f context="Codex review" \
            -f description="$description" \
            -f target_url="https://github.com/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > /tmp/codex-status.json
          exit "$result"
