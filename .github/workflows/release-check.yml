name: release-check

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0

      - name: Activate the pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, build, test, and smoke
        run: bash scripts/release-check.sh

      - name: Verify pi-ai resolution (production install layout)
        run: node scripts/check-pi-resolution.mjs
