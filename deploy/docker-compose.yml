# Supported Core deployment shape (docs/DEPLOYMENT.md).
#
#   cd deploy
#   cp .env.example .env       # set THEBE_TOKEN, THEBE_ALLOWED_HOSTS, THEBE_WORKSPACE
#   docker compose up -d --build
#
# The HTTP port is published on loopback only. Terminate TLS with Tailscale
# Serve/Funnel or a reverse proxy on the host; never publish Core directly to
# the internet, and never send the token over plaintext off-host traffic.
services:
  thebe-core:
    # By default this builds from the local source. To run the published image
    # instead, set THEBE_IMAGE in deploy/.env (see .env.example) and pull:
    #   docker login ghcr.io && docker compose pull && docker compose up -d
    image: ${THEBE_IMAGE:-thebe-core:0.1.0}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      THEBE_HOST: 0.0.0.0
      THEBE_PORT: 8787
      THEBE_CONFIG_DIR: /data/config
      THEBE_AGENT_DIR: /data/agent
      THEBE_AGENT_STORE_DIR: /data/store
      THEBE_OUTPUT_DIR: /data/outputs
      THEBE_WORKSPACE_DIR: /workspace
      HOME: /data/home
    ports:
      # Loopback by default. For a home LAN set THEBE_BIND to the host's LAN address in .env
      # (never 0.0.0.0); see docs/DEPLOYMENT.md "Home network mode".
      - "${THEBE_BIND:-127.0.0.1}:8787:8787"
    volumes:
      - ./data:/data
      - ${THEBE_WORKSPACE:-./workspace}:/workspace
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The image already declares the healthcheck (GET /v1/health with
    # X-Thebe-Token); keep it in one place so the two cannot drift apart.
